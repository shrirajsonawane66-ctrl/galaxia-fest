    <div class="layer" style="transform:translateZ(3px)"></div>
    <div class="layer" style="transform:translateZ(4px)"></div>
    <div class="face front">
      <div class="pn l"></div><div class="pn r"></div>
      <div class="shine" id="shine"></div>
    </div>
    <div class="face back"></div>
  </div>
</div>
<div class="shadow"></div>
<div class="ui">
  <button id="flip">Flip pass</button>
  <button id="spin" aria-pressed="true">Auto‑spin</button>
  <button id="reset">Reset</button>
</div>
<p class="hint">Drag to rotate 360° · double‑click to flip · arrow keys also work</p>

<script>
// ---- CONFIG: set the holder's pass number (or use ?no=GX-0042 in the URL) ----
const PASS_NO = "";

(function(){
  const card=document.getElementById('card'), stage=document.getElementById('stage'), shine=document.getElementById('shine');
  const qs = new URLSearchParams(location.search);
  const no = qs.get('no') || PASS_NO;
  if(no){document.querySelectorAll('.pn').forEach(e=>{e.textContent=no;e.style.display='flex'})}

  let ry=-25, rx=8, vy=0, vx=0, auto=true, dragging=false, lx=0, ly=0, target=null;
  const spinBtn=document.getElementById('spin');

  function render(){
    card.style.transform='rotateX('+rx+'deg) rotateY('+ry+'deg)';
    const a=((ry%360)+360)%360;
    shine.style.backgroundPosition=(100-(a/360)*200)+'% 0';
  }
  function tick(){
    if(target!==null){ ry+=(target-ry)*0.12; if(Math.abs(target-ry)<0.3){ry=target;target=null} }
    else if(!dragging){
      ry+=vy; rx+=vx; vy*=0.95; vx*=0.9;
      if(auto) ry+=0.35;
      rx+=(8-rx)*(auto?0.02:0.005);
    }
    render(); requestAnimationFrame(tick);
  }
  stage.addEventListener('pointerdown',e=>{dragging=true;target=null;lx=e.clientX;ly=e.clientY;vy=vx=0;stage.classList.add('drag');stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    ry+=dx*0.5; rx=Math.max(-40,Math.min(40,rx-dy*0.3)); vy=dx*0.5; vx=0;
  });
  const end=()=>{dragging=false;stage.classList.remove('drag')};
  stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);

  function flip(){ auto=false; spinBtn.setAttribute('aria-pressed','false'); const base=Math.round(ry/180)*180; target=base+180; }
  document.getElementById('flip').onclick=flip;
  stage.addEventListener('dblclick',flip);
  spinBtn.onclick=()=>{auto=!auto;spinBtn.setAttribute('aria-pressed',String(auto))};
  document.getElementById('reset').onclick=()=>{auto=false;spinBtn.setAttribute('aria-pressed','false');rx=8;target=0};
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')vy-=6; else if(e.key==='ArrowRight')vy+=6;
    else if(e.key==='ArrowUp')rx=Math.max(-40,rx-5); else if(e.key==='ArrowDown')rx=Math.min(40,rx+5);
  });
  tick();
})();
</script>
</body>
</html>
